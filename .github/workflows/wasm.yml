name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (a branch)
        with:
          toolchain: "1.95" # keep in step with rust-toolchain.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      # The canonical build: a pinned linux/amd64 Rust 1.95.0 container with
      # binaryen 133, the same one that built the committed file.
      - name: Build the module
        run: scripts/build-wasm-docker.sh "$RUNNER_TEMP/wasm"
      - name: The committed opencrs.wasm is what the sources build
        run: cmp "$RUNNER_TEMP/wasm/opencrs.wasm" opencrs.wasm
      - name: Smoke test (imports, lint, probing, memory)
        run: node js/smoke.mjs "$RUNNER_TEMP/wasm"
      # The conformance suite through the module, judged by the Rust CLI.
      - name: Conformance suite through the module
        env:
          OPENCRS_WASM: ${{ runner.temp }}/wasm
        run: cargo run -p opencrs-cli -- conformance --cmd "node js/conformance-adapter.mjs"
