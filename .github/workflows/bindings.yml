name: Bindings

on:
  workflow_dispatch:
  # Called by bindings-publish.yml to build and test a release tag. Nothing
  # is published here.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, like v0.1.2. Empty builds the ref that triggered the run.
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "bindings/**"
      - "crates/**"
      - "schema/**"
      - "rulepacks/**"
      - "conformance/**"
      - "examples/**"
      - "parity/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/bindings.yml"
  pull_request:
    paths:
      - "bindings/**"
      - "crates/**"
      - "schema/**"
      - "rulepacks/**"
      - "conformance/**"
      - "examples/**"
      - "parity/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/bindings.yml"

permissions:
  contents: read

jobs:
  # Each native build runs its tests on the runner it was built on. Nothing
  # is published: the .node files are kept as artifacts only.
  npm:
    name: npm (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # The musl builds run in an Alpine container started by hand: a job
          # container would put the JavaScript actions (checkout, upload)
          # inside Alpine, which GitHub supports only on x64.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, image: "node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, image: "node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        working-directory: bindings/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ !matrix.image }}
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (a branch)
        if: ${{ !matrix.image }}
        with:
          toolchain: "1.95" # keep in step with rust-toolchain.toml
      - name: Build and test
        if: ${{ !matrix.image }}
        run: |
          npm ci
          npm run build
          npm test
      # Alpine has no Rust or C toolchain; rustup installs the one
      # rust-toolchain.toml names.
      - name: Build and test (musl, in Alpine)
        if: ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/bindings/npm "$IMAGE" sh -euc '
            apk add --no-cache build-base curl git
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            # napi assumes a cross linker for aarch64 musl; here it is native.
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc
            rustup toolchain install
            npm ci
            npm run build
            npm test'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencrs-${{ matrix.target }}
          # binding.js is generated by the build and loads the .node files
          # next to it; the publish job takes it from here.
          path: |
            bindings/npm/*.node
            bindings/npm/binding.js
            bindings/npm/binding.d.ts
          if-no-files-found: error

  # Builds an abi3 wheel (Python 3.9+) on each runner and tests it there.
  # Wheels are kept as artifacts only; nothing is published.
  python:
    name: python (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, manylinux: musllinux_1_2, image: "python:3.12-alpine@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d" }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, manylinux: musllinux_1_2, image: "python:3.12-alpine@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (a branch)
        with:
          toolchain: "1.95" # keep in step with rust-toolchain.toml
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --out dist
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
      # A musl wheel can't be imported on the glibc runner, so it is tested in
      # an Alpine container with the repo mounted.
      - name: Test the wheel (musl)
        if: ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/bindings/python ${{ matrix.image }} sh -c '
            python -m venv /venv &&
            /venv/bin/python -m pip install --upgrade "pip>=26.2.2" &&
            /venv/bin/python -m pip install --no-index --find-links dist opencrs &&
            /venv/bin/python -m pip install pytest &&
            /venv/bin/python -m pytest tests'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: ${{ !matrix.image }}
      - name: Test the wheel
        if: ${{ !matrix.image }}
        shell: bash
        run: |
          uv venv --python 3.12
          uv pip install --no-index --find-links dist opencrs
          uv pip install pytest
          uv run --no-sync pytest tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencrs-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
