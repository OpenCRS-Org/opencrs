# Publishes the language bindings, @opencrs/opencrs (npm) and opencrs (PyPI),
# once a tagged release has been built. Both use trusted publishing (OIDC, no
# token): each registry trusts this repository and this workflow file,
# bindings-publish.yml. The publish jobs are in this file, not in a called
# workflow, because npm doesn't accept a publish from a called workflow.
#
# The version lives in the files (package.json, Cargo.toml and pyproject.toml
# under bindings/) and is bumped by the release commit, like the CLI's. The
# check job fails the run if they don't match the tag, so a wrong version never
# gets as far as a build. Nothing is published unless every platform builds
# and passes its tests.
#
# Prereleases (a tag containing "-") go under the npm "next" dist-tag, and PyPI
# treats them as pre-releases.
name: Bindings publish

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # To publish (or retry) a release that's already on GitHub.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, like v0.1.2
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  # Only for a tag push whose release succeeded (Release also runs on pull
  # requests, to plan).
  check:
    name: Check versions match the tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Compare the binding versions with the tag
        run: |
          set -euo pipefail
          uv run --no-project --with packaging python scripts/check-binding-versions.py "$TAG"

  build:
    name: Build and test
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/bindings.yml
    with:
      tag: ${{ inputs.tag || github.event.workflow_run.head_branch }}

  npm:
    name: Publish @opencrs/opencrs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm 11.21.1
        run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opencrs-*
          path: artifacts
      # One package carries every platform's binary next to binding.js, which
      # loads the local opencrs.<platform>.node first.
      - name: Gather the binaries
        working-directory: bindings/npm
        run: |
          set -euo pipefail
          for p in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl win32-x64-msvc; do
            files=(../../artifacts/opencrs-*/"opencrs.$p.node")
            [ -f "${files[0]}" ] || { echo "::error::missing opencrs.$p.node"; exit 1; }
            cp "${files[0]}" .
          done
          # Generated by the build and identical on every platform.
          cp ../../artifacts/opencrs-x86_64-unknown-linux-gnu/binding.js ../../artifacts/opencrs-x86_64-unknown-linux-gnu/binding.d.ts .
          nodes=(./*.node)
          test "${#nodes[@]}" -eq 7
          ls -l ./*.node binding.js
      - name: Check the package contents
        working-directory: bindings/npm
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > ../../pack.json
          node ../../scripts/check-npm-pack.mjs ../../pack.json "$TAG"
          rm ../../pack.json ./*.tgz
      - name: Publish
        working-directory: bindings/npm
        run: |
          set -euo pipefail
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag" --ignore-scripts

  pypi:
    name: Publish opencrs to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Create this environment under Settings > Environments; the PyPI trusted
    # publisher names it.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opencrs-wheel-*
          path: artifacts
          merge-multiple: true
      # No sdist: the core crate embeds schema/ and rulepacks/ from outside
      # bindings/python, which maturin leaves out of an sdist, so it would not
      # build. The wheels cover all seven targets.
      - name: Check the wheels
        run: |
          set -euo pipefail
          ls -l artifacts
          python3 scripts/check-binding-versions.py --wheels "$TAG" artifacts/*.whl
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts
