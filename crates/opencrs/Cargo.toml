[package]
name = "opencrs"
version = "0.0.0"
description = "OpenCRS core: model, schema validation, resolution and checks"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# Host file helpers (src/fs.rs). Off by default: the WebAssembly build has
# no filesystem or clock.
fs = ["chrono/clock", "chrono/std"]
# Check and probe on all cores with rayon. Off by default (and off in the
# WebAssembly build, which has no threads); output is identical either way.
parallel = ["dep:rayon"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jsonschema = { version = "0.60", default-features = false }
unicode-general-category = "1"
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "alloc"] }
url = "2.5.8"
rayon = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
dist = false
