[package]
name = "opencrs-wasm"
version = "0.1.0"
description = "OpenCRS core as a plain-ABI WebAssembly module (no wasm-bindgen, no imports)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
opencrs = { path = "../opencrs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false }

# jsonschema's hasher asks getrandom for a seed. The module has no entropy
# source (and no imports), so getrandom's custom backend (selected with
# --cfg getrandom_backend="custom" in scripts/build-wasm.sh) supplies a
# fixed one; see `entropy` in src/lib.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"

[package.metadata.dist]
dist = false
