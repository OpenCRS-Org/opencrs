[package]
name = "opencrs-xtask"
version = "0.0.0"
description = "Generates the man page and shell completions for the opencrs command"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "opencrs_xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
opencrs-cli = { path = "../opencrs-cli" }
clap = { version = "4.6.7", default-features = false, features = ["std"] }
clap_mangen = "0.3.3"

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.dist]
dist = false
