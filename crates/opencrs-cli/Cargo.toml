[package]
name = "opencrs-cli"
version = "0.1.2"
description = "Tooling for OpenCRS, the Open Creative Requirements Specification"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["opencrs", "dooh", "creative", "specification"]
publish = false

[lib]
name = "opencrs_cli"
path = "src/lib.rs"

[[bin]]
name = "opencrs"
path = "src/main.rs"

[dependencies]
opencrs = { path = "../opencrs", features = ["fs", "parallel"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SSRF-safe HTTP client, shared with the Node and Python bindings.
opencrs-fetch = { path = "../opencrs-fetch" }
url = "2.5.8"
clap = { version = "4.6.7", features = ["derive", "std", "help", "usage", "error-context", "suggestions", "color"] }
clap_complete = "4.6.11"
anstream = "1.0.0"

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
dist = true
