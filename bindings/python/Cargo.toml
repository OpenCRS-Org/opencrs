[package]
name = "opencrs-py"
version = "0.1.1"
description = "Python bindings for the OpenCRS core (PyO3)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# The extension links against Python only when imported; it is tested from
# Python (tests/test_opencrs.py).
test = false
doctest = false

[dependencies]
opencrs = { path = "../../crates/opencrs", features = ["fs", "parallel"] }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.dist]
dist = false
