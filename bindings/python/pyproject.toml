[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "opencrs"
version = "0.0.0"
description = "Python bindings for OpenCRS, the Open Creative Requirements Specification"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://opencrs.dev"
Source = "https://github.com/OpenCRS-Org/opencrs"

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "opencrs._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
